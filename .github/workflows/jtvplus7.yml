name: Update zio playlist
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'script/jtvplus7.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-jtv2
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Run Script
        env:
          TZ: Asia/Kolkata
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/jtvplus7.py

      - name: Commit and Push Changes
        run: |
          git add zio.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "JIOTV Updated ✅ ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          max_retries=5
          attempt=1

          until [ $attempt -gt $max_retries ]; do
            echo "Push attempt $attempt..."
            git fetch origin main
            git rebase origin/main

            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed, retrying ($attempt/$max_retries)..."
            attempt=$((attempt+1))
            sleep $((RANDOM % 5 + 1))
          done

          echo "❌ All push attempts failed."
          exit 1
